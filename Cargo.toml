[package]
name = "mcp-master"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
# Add "client"
rmcp = { version = "0.16.0", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }


 # Error handling
anyhow = "1.0"

# TODO(nasr): replace this with controlroom logger
tracing = "0.1"  # Logging
tracing-subscriber = "0.3"

# rabbitmq
rabbitmq-stream-client = "0.5"

url = "2.5"
