[package]
name = "mcp-master"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"
rusqlite = { version = "0.29", features = ["bundled"] }

# MCP client SDK. Client-only binary, so default-features off
# (drops the `server` feature and its schemars/pastey deps).
rmcp = { version = "1.6", default-features = false, features = [
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }

# Error handling at the binary boundary.
anyhow = "1.0"

# Structured logging. env-filter so RUST_LOG works at runtime.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Anthropic Messages API transport. rustls + json only, no native TLS,
# matches rmcp's TLS choice and keeps the binary distroless-ready.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Async fn in trait objects (`&dyn LlmClient`) on stable Rust without
# Send/Sync friction. Desugars to `Box<dyn Future + Send>`.
async-trait = "0.1"

# Load `.env` (and `.env.local` if present) into the process environment
# at startup. Production reads ANTHROPIC_API_KEY straight from env; this
# just makes local dev one-shot (`cargo run`) without `source`-gymnastics.
dotenvy = "0.15"

# AMQP client for ai.events pub/sub. Talks to the broker URL in
# RABBITMQ_URL (port 5672), not the Streams protocol on 5552.
lapin = "2"
chrono = "0.4.44"

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
tower = { version = "0.5", default-features = false, features = ["util", "limit"] }

# Correlation IDs in /chat error responses — full anyhow chain stays in logs,
# only an opaque ID surfaces to clients. Prevents leak of RABBITMQ_URL and
# similar secrets via `{:#}` formatter.
uuid = { version = "1", features = ["v4", "serde"] }

# Stream-trait combinators (StreamExt::next) for lapin's Consumer.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Lock-free concurrent utilities for in-memory vector store (mock backend).
parking_lot = "0.12"

# Server-Sent Events parser layered on top of a byte stream. Used to
# consume Anthropic's text/event-stream responses without hand-rolling
# the `event:`/`data:` line-grouping protocol.
eventsource-stream = "0.2"

# Stateful stream translators via the `try_stream!` macro — keeps the
# Anthropic SSE-to-StreamEvent decoder linear instead of hand-rolling
# a Stream impl with a manual state machine.
async-stream = "0.3"

# URL parsing for redacting userinfo (password) from RABBITMQ_URL before
# logging. Only used for log-side scrubbing — lapin still gets the raw URL.
url = "2"

# JSON-Schema validation of LLM-generated tool args before they hit the
# downstream MCP server. Defense-in-depth — CRM-MCP and Controlroom-MCP do
# their own validation, but a coaxed model can produce args that satisfy
# the wire shape (object) yet violate `minimum`/`maximum`/`enum`/etc.
jsonschema = { version = "0.30", default-features = false }

# Jitter for the Anthropic retry-backoff (avoid synchronized retry storms
# when multiple instances all hit a 429 at the same wallclock).
rand = "0.8"

# XML deserialization for Controlroom watchdog publisher
quick-xml = { version = "0.29", features = ["serialize"] }

# JWT decode for AuthScope extractor. HS256 only (default features); no
# `ring`/`openssl` pulled in.
jsonwebtoken = { version = "9", default-features = false }

# Typed errors with `#[derive(Error)]` for the approval state-machine.
thiserror = "1"

# Lock-free concurrent map for the approval store. Entry-API gives us
# atomic compare-and-swap via `entry().and_modify()` — needed for the
# double-confirm race-guard.
dashmap = "6"

# Prometheus metrics. The `metrics` facade lets call-sites record via macros
# without threading a registry; `metrics-exporter-prometheus` renders the text
# exposition. default-features off drops its built-in HTTP listener — we serve
# /metrics via axum.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

[dev-dependencies]
# Async HTTP mock for unit-testing the Anthropic client without network.
wiremock = "0.6"

# Temp sqlite files for memory unit tests.
tempfile = "3"

# Serializes env-var-touching tests so they don't race each other.
serial_test = "3"
