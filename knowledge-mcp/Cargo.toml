# Own workspace root so this subcrate stays independent of the parent mcp-master
# package: mcp-master's build, Dockerfile and CI never touch it.
[workspace]

[package]
name = "knowledge-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
text-splitter = { version = "0.30", features = ["markdown"] }
walkdir = "2"
fastembed = "5"
rmcp = { version = "1.6", features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["limit"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"

[dev-dependencies]
tempfile = "3"
